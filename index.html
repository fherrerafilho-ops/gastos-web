/* Visual igual ao do app Investimentos 2.4: Inter embutida, paleta ardósia/azul, herói em degradê,
   cartões com sombra suave, barra inferior translúcida. Cores das séries do Gastos dentro da mesma paleta. */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --surface-3: #e2e8f0;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --line: rgba(15, 23, 42, .08);
  --line-strong: rgba(15, 23, 42, .15);
  --accent: #2563eb;
  --accent-2: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #dbeafe;
  --s-gasto: #2563eb;
  --s-saldo: #0d9488;
  --s-fixo: #7c3aed;
  --s-var: #d97706;
  --s-parc: #c026d3;
  --s-renda: #ea580c;
  --ok: #059669;
  --ok-bg: rgba(5, 150, 105, .12);
  --warn: #d97706;
  --warn-bg: rgba(217, 119, 6, .13);
  --bad: #dc2626;
  --bad-bg: rgba(220, 38, 38, .12);
  --hero-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 52%, #1d3b7a 100%);
  --hero-box: rgba(255, 255, 255, .07);
  --hero-line: rgba(255, 255, 255, .12);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, .04), 0 4px 12px -2px rgba(15, 23, 42, .06);
  --shadow: 0 4px 10px -2px rgba(15, 23, 42, .06), 0 14px 30px -10px rgba(15, 23, 42, .14);
  --f-display: "Inter Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1015;
    --surface: #161a23;
    --surface-2: #1f2532;
    --surface-3: #2a3242;
    --ink: #f8fafc;
    --ink-2: #cbd5e1;
    --muted: #94a3b8;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .16);
    --accent: #3b82f6;
    --accent-2: #2563eb;
    --accent-soft: rgba(59, 130, 246, .16);
    --s-gasto: #60a5fa;
    --s-saldo: #2dd4bf;
    --s-fixo: #a78bfa;
    --s-var: #fbbf24;
    --s-parc: #e879f9;
    --s-renda: #fb923c;
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, .14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, .14);
    --bad: #f87171;
    --bad-bg: rgba(248, 113, 113, .14);
    --hero-bg: linear-gradient(135deg, #172033 0%, #0f172a 55%, #172554 100%);
    --hero-box: rgba(255, 255, 255, .06);
    --hero-line: rgba(255, 255, 255, .11);
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, .35);
    --shadow: 0 4px 12px rgba(0, 0, 0, .45), 0 16px 32px -12px rgba(0, 0, 0, .75);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1015;
  --surface: #161a23;
  --surface-2: #1f2532;
  --surface-3: #2a3242;
  --ink: #f8fafc;
  --ink-2: #cbd5e1;
  --muted: #94a3b8;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .16);
  --accent: #3b82f6;
  --accent-2: #2563eb;
  --accent-soft: rgba(59, 130, 246, .16);
  --s-gasto: #60a5fa;
  --s-saldo: #2dd4bf;
  --s-fixo: #a78bfa;
  --s-var: #fbbf24;
  --s-parc: #e879f9;
  --s-renda: #fb923c;
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, .14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, .14);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, .14);
  --hero-bg: linear-gradient(135deg, #172033 0%, #0f172a 55%, #172554 100%);
  --hero-box: rgba(255, 255, 255, .06);
  --hero-line: rgba(255, 255, 255, .11);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, .35);
  --shadow: 0 4px 12px rgba(0, 0, 0, .45), 0 16px 32px -12px rgba(0, 0, 0, .75);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.48 var(--f-body);
  font-feature-settings: "tnum" 1, "cv02" 1;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(104px + env(safe-area-inset-bottom, 0px)); }
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  margin: 0 -16px; padding: 10px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.marca-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #2563eb 0%, #0d9488 100%);
  color: #fff; display: grid; place-items: center; flex: none;
  box-shadow: 0 4px 12px -3px rgba(37, 99, 235, .45);
}
.marca-logo svg { width: 19px; height: 19px; }
.marca-txt { display: grid; gap: 1px; min-width: 0; }
.marca { font: 700 17px/1.15 var(--f-display); letter-spacing: -.015em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca-sub { font: 600 11px/1.1 var(--f-body); color: var(--muted); }
.topo-acoes { display: flex; align-items: center; gap: 6px; flex: none; }
.icone {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer;
  display: grid; place-items: center; color: var(--ink-2);
  transition: transform .12s ease, background .15s ease;
}
.icone:hover { background: var(--surface-2); }
.icone:active { transform: scale(.95); }
.icone svg { width: 19px; height: 19px; }
.icone.novo {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  box-shadow: 0 4px 12px -3px color-mix(in srgb, var(--accent) 55%, transparent);
}
.icone.novo:hover { filter: brightness(1.06); }

h2.secao {
  font: 700 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; justify-content: space-between;
}
.cartao {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; box-shadow: var(--shadow-sm);
}
.rot { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* ---------- saldo (herói em degradê) ---------- */
.saldo {
  --st: #34d399;
  background: var(--hero-bg); color: #f8fafc;
  border-radius: 22px; padding: 20px 18px 16px; box-shadow: var(--shadow);
  margin-top: 10px; position: relative; overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .1);
}
.saldo[data-st=ok] { --st: #34d399; }
.saldo[data-st=aviso] { --st: #fbbf24; }
.saldo[data-st=alto] { --st: #f87171; }
.saldo::after {
  content: ""; position: absolute; top: -60px; right: -50px;
  width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, .32) 0%, transparent 70%);
  pointer-events: none;
}
.saldo > * { position: relative; z-index: 1; }
.saldo .linha1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.saldo .rot { color: rgba(248, 250, 252, .72); }
.selo {
  font-size: 11px; font-weight: 700; color: #f8fafc;
  background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .14);
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--st); box-shadow: 0 0 8px var(--st); }
.saldo .valor {
  font: 700 clamp(32px, 9.2vw, 42px)/1.08 var(--f-display);
  letter-spacing: -.025em; margin: 10px 0 12px; font-variant-numeric: tabular-nums; color: #ffffff;
}
.saldo .valor.neg { color: #fca5a5; }
.saldo .uso { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 600; color: rgba(248, 250, 252, .7); margin-bottom: 6px; }
.saldo .uso b { color: #ffffff; font-variant-numeric: tabular-nums; }
.barra { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 999px; background: var(--st); width: 0; transition: width .4s ease; box-shadow: 0 0 10px color-mix(in srgb, var(--st) 60%, transparent); }
.saldo-grade {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hero-line);
}
.saldo-cel { background: var(--hero-box); border: 1px solid rgba(255, 255, 255, .07); border-radius: 12px; padding: 8px 11px; min-width: 0; }
.saldo-cel span { display: block; font-size: 11px; font-weight: 600; color: rgba(248, 250, 252, .64); text-transform: uppercase; letter-spacing: .04em; }
.saldo-cel b { display: block; font-size: 14px; font-weight: 700; color: #ffffff; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.saldo .det { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: rgba(248, 250, 252, .72); }
.saldo .det b { color: #ffffff; font-weight: 600; }
.saldo .dia {
  font-size: 13px; color: rgba(248, 250, 252, .78); margin-top: 10px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  background: var(--hero-box); border-radius: 12px; padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, .07);
}
.saldo .dia b { color: #ffffff; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- indicadores ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; min-width: 0;
}
.kpi-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.kpi-ico {
  width: 34px; height: 34px; border-radius: 10px;
  background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
  color: var(--c, var(--accent));
  display: grid; place-items: center; flex: none;
}
.kpi-ico svg { width: 18px; height: 18px; }
.kpi .rot { font-size: 11px; color: var(--ink-2); font-weight: 700; }
.kpi .v { font: 700 19px/1.2 var(--f-display); margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.015em; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi-barra { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.kpi-barra i { display: block; height: 100%; border-radius: 2px; background: var(--c, var(--accent)); }

/* ---------- barras horizontais ---------- */
.hbar { display: grid; gap: 12px; }
.hbar .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.hbar .nome { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .nome small { color: var(--muted); font-size: 12px; font-weight: 600; margin-left: 6px; }
.hbar .val { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.hbar .trilho { grid-column: 1 / -1; height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.hbar .trilho i { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--accent)); }
.vazio { color: var(--muted); font-size: 14px; padding: 12px 4px; text-align: center; }

/* ---------- lista de lançamentos ---------- */
.filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filtros::-webkit-scrollbar { display: none; }
.filtros.capsula {
  background: var(--surface-2); padding: 4px; border-radius: 13px;
  border: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
}
.filtros.capsula .chip {
  border: 0; background: transparent; border-radius: 9px; padding: 7px 6px;
  font-size: 12.5px; font-weight: 700; color: var(--muted); text-align: center;
}
.filtros.capsula .chip[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .1); }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink-2);
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lista {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; box-shadow: var(--shadow-sm);
}
.lanc {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 13px 14px; border: 0; border-top: 1px solid var(--line); width: 100%;
  background: transparent; text-align: left; cursor: pointer; transition: background .12s ease;
}
.lanc:first-child { border-top: 0; }
.lanc:hover { background: var(--surface-2); }
/* avatar com F (Fixo) ou V (Variável), na cor da classificação */
.av-g {
  width: 42px; height: 42px; border-radius: 13px;
  background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 24%, transparent);
  color: var(--c, var(--accent)); display: grid; place-items: center; flex: none;
  font: 800 17px/1 var(--f-display);
}
.lanc .d { overflow: hidden; display: grid; gap: 3px; }
.lanc .d b { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.lanc .d > span { font-size: 12.5px; color: var(--muted); line-height: 1.38; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.lanc .v { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
.cat-pill {
  font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); white-space: nowrap;
}
.parc { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.parc.wallet { background: var(--accent-soft); color: var(--accent); }
.totlista { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 10px 4px 0; }
.totlista b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- gráficos ---------- */
.grafico {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 14px 12px; margin-bottom: 12px; position: relative; box-shadow: var(--shadow-sm);
}
.grafico h3 { font: 700 16px/1.25 var(--f-display); margin: 0 4px 2px; letter-spacing: -.01em; }
.grafico .sub { font-size: 12px; color: var(--muted); margin: 0 4px 10px; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin: 0 4px 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legenda i.linha { height: 3px; border-radius: 2px; }
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico svg text { fill: var(--muted); font: 11px var(--f-body); }
.grafico svg .grade { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 2; }
.grafico svg .zero { stroke: var(--muted); stroke-width: 1; }
.grafico svg .hit { fill: transparent; cursor: pointer; }
.grafico svg .hit.on { fill: var(--surface-2); }
.dica {
  position: absolute; z-index: 5; pointer-events: none;
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: var(--bg); border-radius: 12px; padding: 9px 12px;
  font-size: 12px; line-height: 1.5; min-width: 156px; box-shadow: var(--shadow);
}
.dica b { font-weight: 700; }
.dica .l { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.dica .l span { display: inline-flex; align-items: center; gap: 6px; }
.dica .l i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

/* ---------- ajustes ---------- */
.campo { display: grid; gap: 6px; margin-bottom: 14px; }
.campo > span { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.entrada {
  width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface-2); outline: none; font-size: 16px; transition: border-color .15s ease, box-shadow .15s ease;
}
.entrada:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent); }
.entrada.grande { height: 56px; font: 700 24px var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ajuda { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 14px; line-height: 1.45; }
.linha-ajuste { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.linha-ajuste:first-child { border-top: 0; padding-top: 0; }
.linha-ajuste .t { font-weight: 600; }
.linha-ajuste .t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.linha-ajuste .btn { white-space: nowrap; flex: none; height: 40px; padding: 0 14px; font-size: 13.5px; }
.metodos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.metodos .chip { display: inline-flex; align-items: center; gap: 6px; cursor: default; background: var(--surface-2); }
.metodos .chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; }
.metodos .chip button:hover { background: var(--surface-3); color: var(--bad); }

.btn {
  height: 46px; border-radius: 13px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 0 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .1s ease, background .15s ease, filter .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.985); }
.btn.pri {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  border-color: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 12px -3px color-mix(in srgb, var(--accent) 45%, transparent);
}
.btn.pri:hover { filter: brightness(1.06); }
.btn.perigo { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
.btn.perigo.armado { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.bloco { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }

/* ---------- navegação inferior translúcida ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.nav button {
  border: 0; background: transparent; cursor: pointer;
  display: grid; justify-items: center; gap: 3px; padding: 6px 0;
  font-size: 11px; font-weight: 600; color: var(--muted); transition: color .15s ease;
}
.nav button .nav-ico { width: 44px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .18s ease; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current=page] { color: var(--accent); font-weight: 700; }
.nav button[aria-current=page] .nav-ico { background: var(--accent-soft); }
.nav .mais {
  width: 54px; height: 54px; border-radius: 18px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: var(--accent-ink); margin: -20px auto 0;
  box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 65%, transparent);
  display: grid; place-items: center; padding: 0;
}
.nav .mais svg { width: 26px; height: 26px; }

/* ---------- folha (janela de baixo) ---------- */
.veu {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(8, 10, 16, .55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
}
.folha {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 26px 26px 0 0; padding: 8px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 34px rgba(0, 0, 0, .28); border-top: 1px solid var(--line);
  animation: sobe .22s cubic-bezier(.2, .85, .3, 1);
}
@keyframes sobe { from { transform: translateY(28px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .folha { animation: none; } .barra > i { transition: none; } }
/* barrinha de puxar: a área de toque é bem maior que o desenho */
.pegador { width: 44px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 45%, transparent); margin: 4px auto 10px; position: relative; touch-action: none; cursor: grab; }
.pegador::before { content: ""; position: absolute; inset: -14px -80px; }
/* barra de cima da janela: seta de voltar + barrinha de puxar; fica presa no topo ao rolar */
.barra-folha {
  position: sticky; top: -8px; z-index: 3;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin: -8px -16px 6px; padding: 6px 10px 4px;
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
}
.barra-folha .pegador { margin: 0 auto; }
.barra-folha .voltar {
  width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--surface-2); cursor: pointer;
  display: grid; place-items: center; color: var(--ink-2);
}
.barra-folha .voltar:hover { background: var(--surface-3); }
.barra-folha .voltar svg { width: 22px; height: 22px; }
.folha h2 { font: 700 22px/1.2 var(--f-display); margin: 0 0 12px; letter-spacing: -.015em; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg.quebra { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span {
  display: block; text-align: center; padding: 11px 6px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface); font-weight: 700; font-size: 13.5px; cursor: pointer; user-select: none;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
/* --ci: cor do texto quando marcado (o âmbar de "Variável" pede texto escuro para dar leitura) */
.seg input:checked + span { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--ci, #fff); box-shadow: 0 3px 10px -2px color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chave { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; margin-bottom: 14px; }
.chave input { position: absolute; opacity: 0; }
.chave .sw { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-3); position: relative; flex: none; transition: background .15s; }
.chave .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.chave input:checked ~ .sw { background: var(--accent); }
.chave input:checked ~ .sw::after { transform: translateX(18px); }
.chave input:focus-visible ~ .sw { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.previa { border-radius: 12px; background: var(--surface); border: 1px dashed var(--line-strong); padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
.previa b { font-variant-numeric: tabular-nums; }
.previa .neg { color: var(--bad); }
.erro { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 18px; margin-bottom: 8px; }

/* ---------- ajustes: Samsung Wallet ---------- */
.cartao .chave.plana { border: 0; padding: 0; background: transparent; margin: 0; }
.chave small { color: var(--muted); }
.leitura { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--st); font-size: 14px; }
.leitura[data-st=ok] { --st: var(--ok); background: var(--ok-bg); }
.leitura[data-st=aviso] { --st: var(--warn); background: var(--warn-bg); }
.leitura ol { margin: 8px 0 12px; padding-left: 20px; display: grid; gap: 6px; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 0; cursor: pointer; text-decoration: underline; font-size: inherit; }
.registro { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.registro summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.registro[open] summary { margin-bottom: 4px; }
.reg { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.reg:first-of-type { border-top: 0; }
.reg .l1 { display: flex; justify-content: space-between; gap: 8px; }
.reg .l1 b { color: var(--ok); }
.reg[data-res=ign] .l1 b { color: var(--muted); }
.reg .l1 span, .reg .l3 { color: var(--muted); font-size: 12px; }
.reg .l3 { overflow-wrap: anywhere; margin-top: 2px; }

/* ---------- boas-vindas ---------- */
.boasvindas { padding-top: 6vh; display: grid; gap: 14px; }
.bv-heroi {
  background: var(--hero-bg); color: #fff; border-radius: 24px; padding: 26px 22px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.bv-heroi::after {
  content: ""; position: absolute; top: -60px; right: -50px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, .32) 0%, transparent 70%); pointer-events: none;
}
.bv-heroi .marca { color: #fff; }
.bv-heroi .marca-sub { color: rgba(255, 255, 255, .7); }
.bv-heroi h1 { font: 700 clamp(30px, 8.5vw, 42px)/1.06 var(--f-display); letter-spacing: -.025em; margin: 16px 0 10px; text-wrap: balance; }
.bv-heroi p { color: rgba(248, 250, 252, .82); margin: 0; font-size: 15px; line-height: 1.5; }
.aviso-ex {
  background: var(--accent-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  border-radius: 14px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px;
}
.aviso-ex button { border: 0; background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 18px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow); max-width: calc(100% - 32px); width: max-content; text-align: center;   /* mensagens longas quebram linha */
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden>
  <div class="in">
    <button type="button" data-aba="inicio" aria-current="page">

<script>
'use strict';
/* ====================================================================
   Gastos do Mês — app web instalável (PWA), dados só neste aparelho.
   Banco: IndexedDB  (lojas: lanc, meses, config)
   ==================================================================== */

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CONFIG_PADRAO = { rendaPadrao: 0, metodos: ['Crédito', 'Débito', 'Pix', 'Boleto'], exemplo: false, iniciado: false };

/* ---------------- banco de dados ---------------- */
const DB = {
  db: null,
  memoria: false,
  abrir() {
    return new Promise(resolve => {
      let req;
      // no iPhone (web) o banco continua na versão 1; a versão 2 é só do app Android (por causa da antiga 1.1)
      try { req = indexedDB.open('gastos-do-mes', 1); } catch (e) { this.memoria = true; return resolve(); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('lanc')) db.createObjectStore('lanc', { keyPath: 'id' }).createIndex('mes', 'mes');
        if (!db.objectStoreNames.contains('meses')) db.createObjectStore('meses', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('config')) db.createObjectStore('config', { keyPath: 'k' });
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => { this.memoria = true; resolve(); };
      req.onblocked = () => { this.memoria = true; resolve(); };
    });
  },
  tudo(loja) {
    if (!this.db) return Promise.resolve([]);
    return new Promise(res => {
      try {
        const r = this.db.transaction(loja).objectStore(loja).getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => res([]);
      } catch (e) { res([]); }
    });
  },
  escrever(loja, puts, dels) {
    if (!this.db) return Promise.resolve();
    return new Promise(res => {
      try {
        const tx = this.db.transaction(loja, 'readwrite');
        const st = tx.objectStore(loja);
        (puts || []).forEach(o => st.put(o));
        (dels || []).forEach(k => st.delete(k));
        tx.oncomplete = () => res();
        tx.onerror = () => { toast('Não consegui salvar no aparelho.'); res(); };
      } catch (e) { res(); }
    });
  },
  limpar(loja) {
    if (!this.db) return Promise.resolve();
    return new Promise(res => {
      try { const tx = this.db.transaction(loja, 'readwrite'); tx.objectStore(loja).clear(); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  },
};

/* estado em memória (espelho do banco) */
const S = { lanc: [], meses: {}, config: { ...CONFIG_PADRAO }, mes: null, aba: 'inicio', filtro: 'todos', notifLog: [] };

async function carregar() {
  await DB.abrir();
  const [lanc, meses, cfg] = await Promise.all([DB.tudo('lanc'), DB.tudo('meses'), DB.tudo('config')]);
  S.lanc = lanc;
  S.meses = {};
  meses.forEach(m => { S.meses[m.id] = m; });
  const c = cfg.find(x => x.k === 'config');
  S.config = { ...CONFIG_PADRAO, ...(c ? c.v : {}) };
  const lg = cfg.find(x => x.k === 'notifLog');
  S.notifLog = lg && Array.isArray(lg.v) ? lg.v : [];
}

const salvarConfig = () => DB.escrever('config', [{ k: 'config', v: S.config }]);
const salvarRegistro = () => DB.escrever('config', [{ k: 'notifLog', v: S.notifLog }]);
const salvarMes = m => { S.meses[m.id] = m; return DB.escrever('meses', [m]); };

function salvarLanc(l) {
  const i = S.lanc.findIndex(x => x.id === l.id);
  if (i >= 0) S.lanc[i] = l; else S.lanc.push(l);
  return DB.escrever('lanc', [l]);
}
function apagarLanc(id) {
  S.lanc = S.lanc.filter(x => x.id !== id);
  return DB.escrever('lanc', [], [id]);
}

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const pct = n => (n * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const idMes = (a, m) => a + '-' + String(m + 1).padStart(2, '0');
const partes = id => { const [a, m] = id.split('-').map(Number); return { a, m: m - 1 }; };
const nomeMes = id => { const p = partes(id); return MESES[p.m] + ' ' + p.a; };
const curtoMes = id => { const p = partes(id); return MES_CURTO[p.m] + '/' + String(p.a).slice(2); };
const somaMes = (id, d) => { const p = partes(id); const x = new Date(p.a, p.m + d, 1); return idMes(x.getFullYear(), x.getMonth()); };
const hojeId = () => { const d = new Date(); return idMes(d.getFullYear(), d.getMonth()); };
const mesesOrdenados = () => Object.keys(S.meses).sort();

function paraNumero(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').replace(/[R$\s]/g, '');
  if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const fmtEntrada = n => (Number(n) || 0) ? Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';

let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------------- regras (as mesmas da planilha) ---------------- */
function resumo(id) {
  const ls = S.lanc.filter(l => l.mes === id);
  const renda = Number((S.meses[id] || {}).renda) || 0;
  let gasto = 0, fixos = 0, variaveis = 0, parcelas = 0, comprometido = 0, nVar = 0;
  const porMetodo = {};
  ls.forEach(l => {
    const v = Number(l.valor) || 0;
    gasto += v;
    if (l.classificacao === 'Fixo') fixos += v;
    else { variaveis += v; nVar++; }
    if (l.total) parcelas += v;
    if ((l.classificacao === 'Fixo' && !l.total) || (l.total && l.atual < l.total)) comprometido += v;
    const m = S.config.metodos.includes(l.metodo) ? l.metodo : 'Outros';
    porMetodo[m] = (porMetodo[m] || 0) + v;
  });
  const topVar = ls.filter(l => l.classificacao !== 'Fixo').sort((a, b) => b.valor - a.valor).slice(0, 5);
  let dias = null;
  if (id === hojeId()) {
    const p = partes(id), hoje = new Date();
    dias = new Date(p.a, p.m + 1, 0).getDate() - hoje.getDate() + 1;
  }
  return {
    id, renda, gasto, saldo: renda - gasto, fixos, variaveis, parcelas, comprometido,
    n: ls.length, mediaVar: nVar ? variaveis / nVar : 0, porMetodo, topVar,
    usado: renda > 0 ? gasto / renda : null, dias,
  };
}
const estado = u => u === null ? 'ok' : (u >= 1 ? 'alto' : (u >= 0.8 ? 'aviso' : 'ok'));
const nomeEstado = st => st === 'alto' ? 'Acima da renda' : (st === 'aviso' ? 'Atenção' : 'Dentro do orçamento');

/** Cria o mês `novo` levando fixos sem parcela, parcelas que continuam e a renda do mês anterior. */
async function criarMes(novo) {
  if (S.meses[novo]) return;
  const anteriores = mesesOrdenados().filter(m => m < novo);
  const ant = anteriores[anteriores.length - 1];
  const renda = ant ? (Number(S.meses[ant].renda) || S.config.rendaPadrao || 0) : (S.config.rendaPadrao || 0);
  await salvarMes({ id: novo, renda });
  if (!ant) return 0;
  const levar = [];
  S.lanc.filter(l => l.mes === ant).forEach(l => {
    if (l.total) {
      if (l.atual < l.total) levar.push({ ...l, id: uid(), mes: novo, atual: l.atual + 1 });
    } else if (l.classificacao === 'Fixo') {
      levar.push({ ...l, id: uid(), mes: novo });
    }
  });
  levar.forEach(l => S.lanc.push(l));
  await DB.escrever('lanc', levar);
  return levar.length;
}

/* ---------------- Samsung Wallet: notificação de pagamento vira gasto ----------------
   O app Android guarda as notificações da carteira numa fila (LeitorNotificacoes.java);
   aqui cada uma é lida: valor, loja, parcelas e método. O que não for compra é ignorado. */
const temLeitor = () => !!(window.Android && window.Android.leituraDisponivel);

const RE_IGNORAR = /recusad|negad|n[aã]o (?:aprovad|autorizad|conclu|realizad)|falh|estorn|cancelad|reembols|devolvid|devolu[cç]|cashback|fatura|vencimento|\bvence|recebeu|recebid|oferta|cupom|promo[cç]|ganhe|\bpontos\b|rewards|declined|failed|refund|cancel|revers/i;
const RE_CARTAO = /(?:cart[aã]o\s*|card\s*)?(?:final|terminad[oa] em|ending(?: in)?)?\s*[•·*.]{2,}\s*\d{4}|\b(?:final|terminad[oa] em|ending in)\s*\d{4}\b/gi;
const RE_DINHEIRO = /(?:R\$|BRL)\s*\d[\d.,]*/gi;
const RE_DATA_HORA = /\b\d{1,2}[/:h]\d{2}(?:[/:]\d{2,4})?\b/gi;
const RE_DOCUMENTO = /\(?\b(?:CPF|CNPJ)\b\s*:?\s*[\d*•.\/-]+\)?|[*•]{3}[\d.]{3,}[\d.*•\/-]*/gi;   // "CPF ***.123.456-**" do Pix
const RE_GENERICO = /samsung|wallet|\bpay\b|pagamento|compra|transa[cç][aã]o|aprovad[ao]|conclu[ií]d[ao]|realizad[ao]|efetuad[ao]|sucesso|cart[aã]o|\bcard\b|cr[eé]dito|d[eé]bito|\bvisa\b|master(?:card)?|\belo\b|amex|hipercard|nubank|ita[uú]|bradesco|santander|caixa|banco|\binter\b|\bc6\b|\bxp\b|\bbtg\b|\bneon\b|\bpan\b|sicoob|sicredi|ourocard|personnalit[eé]|platinum|gold|black|infinite|signature|internacional|international|voc[eê]|pagou|comprou|payment|purchase|completed?|approved|\bpix\b|enviou|enviad[ao]|transfer[eê]ncia|transferiu|destinat[aá]rio|favorecid[ao]|recebedor|\bchave\b|\bvalor\b|\bhoje\b|\bagora\b|\b(?:em|no|na|de|do|da|com|para|at|às|as|e)\b/gi;

/** "1.234,56", "1,234.56", "25", "25,5" → número. */
function numeroDinheiro(s) {
  s = String(s).replace(/[.,]+$/, '');
  const m = s.match(/^(.*?)[.,](\d{1,2})$/);   // centavos: separador seguido de 1 ou 2 dígitos no fim
  const n = parseFloat((m ? m[1] : s).replace(/[.,]/g, '') + (m ? '.' + m[2].padEnd(2, '0') : ''));
  return isFinite(n) ? n : NaN;
}

function valorDaNotificacao(t) {
  const parc = t.match(/(\d{1,2})\s*x\s*(?:de\s*)?(?:R\$|BRL)\s*(\d[\d.,]*)/i);   // "3x de R$ 30,00"
  if (parc) { const n = +parc[1], v = numeroDinheiro(parc[2]); if (n >= 2 && n <= 120 && v > 0) return { valor: v, total: n }; }
  let m = t.match(/(?:R\$|BRL)\s*(\d[\d.,]*)/i);
  let v = m ? numeroDinheiro(m[1]) : NaN;
  if (!(v > 0)) { m = t.match(/(?:^|[^\d/:.,])(\d{1,3}(?:\.\d{3})*,\d{2})(?![\d/])/); v = m ? numeroDinheiro(m[1]) : NaN; }
  if (!(v > 0)) return null;
  const vezes = t.match(/(?:\bem|parcelad[oa] em)\s*(\d{1,2})\s*(?:x\b|vezes|parcelas)/i);   // "R$ 90,00 em 3x"
  if (vezes && +vezes[1] >= 2 && +vezes[1] <= 120) { const n = +vezes[1]; return { valor: Math.round((v / n) * 100) / 100, total: n }; }
  return { valor: v, total: null };
}

/** Nome em MAIÚSCULAS (como vem da maquininha) fica "Padaria Pão Quente". */
function nomeBonito(s) {
  if (s !== s.toUpperCase() || !/[A-ZÀ-Ú]{3}/.test(s)) return s;
  return s.toLowerCase().replace(/[\p{L}\d]+/gu, (p, i) => (i > 0 && /^(?:de|da|do|das|dos|e)$/.test(p)) ? p : p[0].toUpperCase() + p.slice(1));
}

function temNome(s) {
  return (s.replace(RE_GENERICO, ' ').match(/\p{L}/gu) || []).length >= 3;
}

/** Tira do começo e do fim as palavras que não são o nome da loja ("Pagamento aprovado em", "com cartão"). */
const PALAVRA_GENERICA = /^(?:samsung|wallet|pay|pagamento|pago|paga|foi|compra|transa[cç][aã]o|aprovad[ao]|conclu[ií]d[ao]|realizad[ao]|efetuad[ao]|enviad[ao]|sucesso|cart[aã]o|card|cr[eé]dito|d[eé]bito|visa|master|mastercard|elo|amex|voc[eê]|pagou|comprou|fez|uma?|payment|purchase|paid|you|completed?|approved|pix|enviou|transfer[eê]ncia|transferiu|destinat[aá]rio|favorecid[ao]|recebedor|chave|valor|hoje|agora|em|no|na|nos|nas|de|do|da|com|para|pra|at|às|à|ao|as|e|o|a|os|seu|sua|\d{1,2}x|vezes|parcelas?|parcelad[ao])$/i;
function aparar(s) {
  const p = s.split(/\s+/).filter(Boolean);
  const nua = w => w.replace(/^[^\p{L}\d]+|[^\p{L}\d]+$/gu, '');
  const generica = w => !/[\p{L}\d]/u.test(w) || PALAVRA_GENERICA.test(nua(w));
  // "via"/"pelo" só saem junto com a palavra genérica seguinte ("Pagamento via Pix concluído"), para não cortar "Via Varejo"
  const ligacao = (w, seguinte) => /^(?:via|pel[oa])$/i.test(nua(w)) && (seguinte === undefined || generica(seguinte));
  while (p.length && (generica(p[0]) || ligacao(p[0], p[1]))) p.shift();
  while (p.length && (generica(p[p.length - 1]) || ligacao(p[p.length - 1]))) p.pop();
  return p.join(' ').replace(/[\s.,;:!?…'"“”]+$/, '').slice(0, 80);   // "foi pago a JOÃO DA SILVA." sem o ponto final
}

function lojaDaNotificacao(titulo, texto, sub) {
  const limpar = s => s.replace(RE_CARTAO, ' ').replace(RE_DOCUMENTO, ' ').replace(/[ \t]+/g, ' ').trim();
  const semValor = s => s.replace(RE_DINHEIRO, ' ').replace(RE_DATA_HORA, ' ');
  // separa também as frases ("...SILVA. Toque para ver"), mas não abreviações ("J. SILVA", "COM. DE ALIMENTOS")
  const SEP = /\n|[·•|]|\s[-–—]\s|,\s|:\s|(?<=\p{L}{2})\.\s+(?=\p{Lu}\p{Ll}|\d)/u;
  const corta = s => s.split(SEP)[0].split(/\s(?:com|usando|via|pel[oa])\s(?:o\s|a\s)?(?:seu\s|sua\s)?(?:cart[aã]o|pix\b|samsung|wallet)|\sàs?\s\d|\sem\s\d/i)[0];
  const tudo = limpar([titulo, texto].filter(Boolean).join('\n'));
  // Pix: "R$ 25,00 foi pago a JOÃO DA SILVA" / "Pix de R$ 50,00 enviado para MARIA" / "Você transferiu R$ 10,00 para JOSÉ"
  let m = tudo.match(/\b(?:pag[oa]|pagou|enviad[oa]|enviou|transferid[oa]|transferiu|paid|sent)(?:\s+(?:R\$|BRL)\s*\d[\d.,]*)?\s+(?:a|à|ao|para|pra|to)\s+(.+)/i);
  if (m) { const c = aparar(semValor(corta(m[1]))); if (temNome(c)) return nomeBonito(c); }
  // Cartão (formato real da Samsung Wallet): título = nome do cartão ("Amex Platinum Card"),
  // texto = estabelecimento seguido do valor ("MEDICINAL F MAN PROD NATURA R$ 161,00")
  for (const linha of limpar(texto).split('\n')) {
    m = linha.match(/^(.+?)\s*(?:R\$|BRL)\s*\d/i);
    if (m) { const c = aparar(semValor(corta(m[1]))); if (temNome(c)) return nomeBonito(c); }
  }
  // "R$ 25,00 em PADARIA X" / "Você pagou R$ 25,00 na PADARIA X" / "R$25.00 at PADARIA X"
  m = tudo.match(/(?:R\$|BRL)\s*\d[\d.,]*\s+(?:em|no|na|at|para|com)\s+(?!\d+\s*(?:x|vezes|parcelas)\b)(.+)/i);
  if (m) { const c = aparar(semValor(corta(m[1]))); if (temNome(c)) return nomeBonito(c); }
  // "Compra na PADARIA X no valor de R$ 25,00" / "Pix para JOÃO SILVA no valor de R$ 50,00"
  m = tudo.match(/(?:\bem|\bno|\bna|\bat|\bpara)\s+(.+?)\s+(?:no valor de|valor|de)\s+(?:R\$|BRL)/i);
  if (m) { const c = aparar(semValor(corta(m[1]))); if (temNome(c)) return nomeBonito(c); }
  // senão: o primeiro trecho do texto que não seja só valor, cartão, banco ou palavra genérica.
  // O título e o subtexto ficam de fora: na Samsung Wallet eles trazem o nome do cartão, não a loja.
  const trechos = limpar(texto).split(SEP);
  for (const t of trechos) {
    const c = aparar(semValor(t));
    if (temNome(c)) return nomeBonito(c);
  }
  return '';
}

/** A Samsung Wallet também faz Pix: a notificação diz se foi Pix, débito ou crédito. */
const ehPix = (t, canal) => /\bpix\b/i.test(t) || /pix/i.test(canal || '');

/** Pix, débito ou crédito pelo que a notificação diz; sem pista, o método escolhido em Ajustes. */
function metodoDaNotificacao(t, canal) {
  const ms = S.config.metodos;
  const achar = re => ms.find(x => re.test(x));
  if (ehPix(t, canal)) return achar(/\bpix\b/i) || 'Pix';
  if (/d[eé]bito|debit/i.test(t)) { const d = achar(/d[eé]bito/i); if (d) return d; }
  if (/cr[eé]dito|credit/i.test(t)) { const c = achar(/cr[eé]dito/i); if (c) return c; }
  if (ms.includes(S.config.metodoCarteira)) return S.config.metodoCarteira;
  return achar(/cr[eé]dito/i) || ms[0] || 'Crédito';
}

function lerNotificacao(n) {
  const titulo = String(n.titulo || ''), texto = String(n.texto || ''), sub = String(n.sub || '');
  const tudo = [titulo, texto, sub].filter(Boolean).join('\n');
  if (RE_IGNORAR.test(tudo)) return { ok: false, motivo: 'Não parece um pagamento aprovado' };
  const v = valorDaNotificacao(tudo);
  if (!v) return { ok: false, motivo: 'Sem valor em R$' };
  const pix = ehPix(tudo, n.canal);
  return { ok: true, ...v, descricao: lojaDaNotificacao(titulo, texto, sub) || (pix ? 'Pix Samsung Wallet' : 'Compra Samsung Wallet'),
    metodo: metodoDaNotificacao(tudo, n.canal) };
}

let lendoCarteira = false, lerDeNovo = false;
async function processarCarteira() {
  if (!temLeitor() || !S.config.iniciado || S.config.exemplo) return;   // espera o app começar de verdade
  if (lendoCarteira) { lerDeNovo = true; return; }
  let fila;
  try { fila = JSON.parse(window.Android.lerFila() || '[]'); } catch (e) { return; }
  if (!Array.isArray(fila) || !fila.length) return;
  lendoCarteira = true;
  try {
    const lancados = [];
    for (const n of fila) {
      const r = lerNotificacao(n);
      if (r.ok && S.lanc.some(l => l.notif === n.id)) { r.ok = false; r.motivo = 'Já tinha sido lançado'; }
      const reg = { quando: n.quando, titulo: n.titulo || '', texto: [n.texto, n.sub].filter(Boolean).join(' · '), res: r.ok ? 'ok' : 'ign', desc: r.motivo || '' };
      if (r.ok) {
        const d = new Date(Number(n.quando) || Date.now());
        const mes = idMes(d.getFullYear(), d.getMonth());
        if (!S.meses[mes]) await criarMes(mes);
        if (!S.config.metodos.includes(r.metodo)) { S.config.metodos.push(r.metodo); await salvarConfig(); }   // ex.: Pix removido dos métodos
        const l = { id: uid(), mes, classificacao: 'Variável', descricao: r.descricao, valor: r.valor, metodo: r.metodo,
          atual: r.total ? 1 : null, total: r.total, criadoEm: Date.now(), origem: 'carteira', notif: n.id };
        await salvarLanc(l);
        lancados.push(l);
        reg.desc = `${l.descricao} · ${brl(l.valor)}${l.total ? ` (1/${l.total})` : ''} · ${l.metodo} · ${nomeMes(mes)}`;
      }
      S.notifLog.unshift(reg);
    }
    S.notifLog = S.notifLog.slice(0, 30);
    await salvarRegistro();
    window.Android.limparFila(String(fila[fila.length - 1].n));   // só depois de salvo
    if (lancados.length === 1) {
      const l = lancados[0];
      toast(`Samsung Wallet: ${l.descricao} · ${brl(l.valor)}${l.mes !== S.mes ? ` em ${nomeMes(l.mes)}` : ''}`);
    } else if (lancados.length > 1) toast(`${lancados.length} pagamentos da Samsung Wallet lançados.`);
    if (!$('#camada').innerHTML) render();   // não redesenha por baixo de um formulário aberto
  } finally {
    lendoCarteira = false;
    if (lerDeNovo) { lerDeNovo = false; processarCarteira(); }
  }
}

/* ---------- gráficos em SVG ---------- */
function escalaBonita(max, min) {
  const faixa = Math.max(1, max - Math.min(0, min));
  const bruto = faixa / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const passo = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= bruto);
  const lo = Math.min(0, Math.floor(min / passo) * passo);
  const hi = Math.max(passo, Math.ceil(max / passo) * passo);
  const ticks = [];
  for (let v = lo; v <= hi + 1e-6; v += passo) ticks.push(v);
  return { lo, hi, ticks };
}
const kfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : String(Math.round(v));

let graficos = [];
function graficoBarras({ id, titulo, sub, labels, series, empilhado, linha, rotulos }) {
  const W = 340, H = 200, L = 38, R = 8, T = 10, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const n = labels.length;
  const somas = labels.map((_, i) => empilhado ? series.reduce((t, s) => t + Math.max(0, s.valores[i]), 0) : Math.max(...series.map(s => s.valores[i])));
  const mins = labels.map((_, i) => Math.min(0, ...series.map(s => s.valores[i])));
  const tops = somas.concat(linha ? linha.valores : []);
  const esc_ = escalaBonita(Math.max(0, ...tops), Math.min(0, ...mins));
  const y = v => T + ph - ((v - esc_.lo) / (esc_.hi - esc_.lo)) * ph;
  const bw = pw / n;
  const grupo = empilhado ? 1 : series.length;
  const larg = Math.min(34, (bw * 0.64) / grupo);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">`;
  esc_.ticks.forEach(t => {
    svg += `<line class="${t === 0 ? 'zero' : 'grade'}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`;
    svg += `<text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${kfmt(t)}</text>`;
  });
  labels.forEach((lab, i) => {
    const cx = L + bw * i + bw / 2;
    svg += `<rect class="hit" data-g="${id}" data-i="${i}" x="${L + bw * i + 1}" y="${T}" width="${bw - 2}" height="${ph}" rx="6"/>`;
    if (n <= 8 || i % 2 === (n - 1) % 2) svg += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
    let base = 0;
    series.forEach((s, k) => {
      const v = s.valores[i];
      if (!v) return;
      let x0, y0, h;
      if (empilhado) {
        x0 = cx - larg / 2;
        y0 = y(base + Math.max(0, v)); h = y(base) - y0; base += Math.max(0, v);
        if (h > 2) { h -= 1.5; } // pequeno vão entre segmentos
      } else {
        x0 = cx - (larg * grupo) / 2 + larg * k + 1;
        y0 = v >= 0 ? y(v) : y(0); h = Math.abs(y(v) - y(0));
      }
      const w = empilhado ? larg : larg - 2;
      svg += `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" style="fill:${s.cor}" pointer-events="none"/>`;
      if (rotulos && n <= 8) {
        const ty = v >= 0 ? y0 - 4 : y0 + h + 11;
        svg += `<text x="${(x0 + w / 2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" style="font-size:10px;font-weight:600;fill:${v < 0 ? 'var(--bad)' : 'var(--ink-2)'}" pointer-events="none">${kfmt(v)}</text>`;
      }
    });
  });
  if (linha) {
    const pts = linha.valores.map((v, i) => `${(L + bw * i + bw / 2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" style="stroke:${linha.cor}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" pointer-events="none"/>`;
    linha.valores.forEach((v, i) => { svg += `<circle cx="${(L + bw * i + bw / 2).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" style="fill:${linha.cor};stroke:var(--surface)" stroke-width="2" pointer-events="none"/>`; });
  }
  svg += '</svg>';
  const leg = series.length + (linha ? 1 : 0) > 1
    ? `<div class="legenda">${series.map(s => `<span><i style="--c:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}${linha ? `<span><i class="linha" style="--c:${linha.cor}"></i>${esc(linha.nome)}</span>` : ''}</div>` : '';
  graficos[id] = { labels, series, linha };
  return `<div class="grafico" data-grafico="${id}"><h3>${esc(titulo)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}${leg}${svg}</div>`;
}

function mostrarDica(el) {
  document.querySelectorAll('.dica').forEach(d => d.remove());
  document.querySelectorAll('.hit.on').forEach(h => h.classList.remove('on'));
  const g = graficos[+el.dataset.g]; const i = +el.dataset.i;
  if (!g) return;
  el.classList.add('on');
  const box = el.closest('.grafico');
  const linhas = g.series.map(s => `<div class="l"><span><i style="--c:${s.cor}"></i>${esc(s.nome)}</span><b>${brl(s.valores[i])}</b></div>`)
    .concat(g.linha ? [`<div class="l"><span><i style="--c:${g.linha.cor}"></i>${esc(g.linha.nome)}</span><b>${brl(g.linha.valores[i])}</b></div>`] : []);
  const d = document.createElement('div');
  d.className = 'dica';
  d.innerHTML = `<b>${esc(g.labels[i])}</b>${linhas.join('')}`;
  box.appendChild(d);
  const rb = box.getBoundingClientRect(), re = el.getBoundingClientRect();
  let left = re.left - rb.left + re.width / 2 - d.offsetWidth / 2;
  left = Math.max(8, Math.min(rb.width - d.offsetWidth - 8, left));
  d.style.left = left + 'px';
  d.style.top = Math.max(8, re.top - rb.top - 6) + 'px';
}

/* ---------------- folha: adicionar / editar ---------------- */
function abrirFolha(html, aoMontar) {
  const c = $('#camada');
  // barra de cima: seta de voltar (fecha a janela, como o Voltar do Android) e a barrinha de puxar
  c.innerHTML = `<div class="veu" data-fechar="1"><div class="folha" role="dialog" aria-modal="true">
    <div class="barra-folha"><button type="button" class="voltar" data-fechar="1" aria-label="Voltar">${IC.voltar}</button><div class="pegador" aria-hidden="true"></div></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  const folha = c.querySelector('.folha');
  arrastarParaFechar(folha);
  if (aoMontar) aoMontar(folha);
}

/**
 * Puxar para baixo fecha a folha: pela barrinha (ou o topo da folha) a qualquer momento,
 * ou por qualquer ponto quando o conteúdo já está no início. Puxão curto: a folha volta ao lugar.
 */
function arrastarParaFechar(folha) {
  const veu = folha.parentElement;
  let y0 = null, x0 = 0, dy = 0, pelaAlca = false, arrastando = false, yAnt = 0, tAnt = 0, vel = 0;
  folha.addEventListener('touchstart', ev => {
    y0 = null;
    if (ev.touches.length !== 1) return;
    const toque = ev.touches[0];
    pelaAlca = toque.clientY - folha.getBoundingClientRect().top < 56;
    if (!pelaAlca && folha.scrollTop > 0) return;   // conteúdo rolado: o gesto é rolagem normal
    y0 = yAnt = toque.clientY; x0 = toque.clientX; tAnt = Date.now(); dy = 0; vel = 0; arrastando = false;
  }, { passive: true });
  folha.addEventListener('touchmove', ev => {
    if (y0 === null) return;
    const y = ev.touches[0].clientY, d = y - y0, dx = ev.touches[0].clientX - x0;
    if (!arrastando) {
      if (Math.abs(d) < 6 && Math.abs(dx) < 6) return;                   // ainda não dá para saber a direção
      if (d <= 0 || Math.abs(dx) > Math.abs(d)) { y0 = null; return; }   // para cima ou para o lado: rolagem normal
      arrastando = true;
      folha.style.animation = 'none';
      folha.style.transition = 'none';
      if (document.activeElement && folha.contains(document.activeElement)) document.activeElement.blur();
    }
    if (ev.cancelable) ev.preventDefault();
    const agora = Date.now();
    if (agora > tAnt) { vel = (y - yAnt) / (agora - tAnt); yAnt = y; tAnt = agora; }
    dy = Math.max(0, d);
    folha.style.transform = `translateY(${dy}px)`;
    veu.style.background = `rgba(8, 10, 14, ${(0.5 * Math.max(0, 1 - dy / folha.offsetHeight)).toFixed(3)})`;
  }, { passive: false });
  const soltar = () => {
    const estava = arrastando;
    y0 = null; arrastando = false;
    if (!estava) return;
    folha.style.transition = 'transform .2s ease-out';
    veu.style.transition = 'background .2s ease-out';
    if (Date.now() - tAnt > 100) vel = 0;   // o dedo parou antes de soltar: não foi um "peteleco"
    if (dy > Math.min(160, folha.offsetHeight * 0.3) || (dy > 30 && vel > 0.5)) {
      folha.style.transform = `translateY(${folha.offsetHeight}px)`;
      veu.style.background = 'rgba(8, 10, 14, 0)';
      setTimeout(() => { if (folha.isConnected) fecharFolha(); }, 200);
    } else {
      folha.style.transform = '';
      veu.style.background = '';
    }
  };
  folha.addEventListener('touchend', soltar);
  folha.addEventListener('touchcancel', soltar);
}
function fecharFolha() {
  $('#camada').innerHTML = '';
  document.body.style.overflow = '';
}

        </div>
        ${ed ? '' : `<div class="campo"><span>O valor digitado é</span><div class="seg">

    const r0 = resumo(S.mes);

    form.addEventListener('change', atualizar);

      if (!rv('metodo')) return erro('Escolha o método de pagamento.');

      if ($('#fParc').checked) {

      const novo = {

        id: ed ? lanc.id : uid(), mes: ed ? lanc.mes : S.mes, classificacao: rv('classificacao') || 'Variável', descricao: desc,

    const bA = folha.querySelector('#fApagar');

      if (!bA.classList.contains('armado')) { bA.classList.add('armado'); bA.textContent = 'Toque para confirmar'; return; }
      await apagarLanc(lanc.id);
      fecharFolha(); toast('Gasto apagado.'); render();
    });
  });
}

/* ---------------- backup ---------------- */
function baixar(nome, conteudo, tipo) {
  if (window.Android && window.Android.salvarArquivo) { window.Android.salvarArquivo(nome, tipo, conteudo); return; }
  const blob = new Blob([conteudo], { type: tipo });
  const file = (typeof File === 'function') ? new File([blob], nome, { type: tipo }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: nome }).catch(() => salvarArquivo(blob, nome));
    return;
  }
  salvarArquivo(blob, nome);
}
function salvarArquivo(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportar() {
  const dados = { app: 'gastos-do-mes', versao: 1, exportadoEm: new Date().toISOString(), config: S.config, meses: Object.values(S.meses), lanc: S.lanc };
  const d = new Date();
  baixar(`gastos-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`, JSON.stringify(dados, null, 1), 'application/json');
}
function exportarCSV() {
  const ls = S.lanc.filter(l => l.mes === S.mes);
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const linhas = [['Classificação', 'Descrição', 'Valor (R$)', 'Método', 'Parcela Atual', 'Total De Parcelas'].map(q).join(';')]
    .concat(ls.map(l => [q(l.classificacao), q(l.descricao), String(l.valor).replace('.', ','), q(l.metodo), l.atual || '', l.total || ''].join(';')));
  baixar(`gastos-${S.mes}.csv`, '﻿' + linhas.join('\r\n'), 'text/csv');
}
async function importarTexto(txt) {
  let d;
  try { d = JSON.parse(txt); } catch (e) { return toast('Esse arquivo não é um backup válido.'); }
  if (!d || d.app !== 'gastos-do-mes' || !Array.isArray(d.lanc) || !Array.isArray(d.meses)) return toast('Esse arquivo não é um backup do Gastos do Mês.');
  await Promise.all([DB.limpar('lanc'), DB.limpar('meses')]);
  S.lanc = d.lanc.map(l => ({ ...l, valor: Number(l.valor) || 0, atual: l.atual || null, total: l.total || null }));
  S.meses = {}; d.meses.forEach(m => { S.meses[m.id] = { id: m.id, renda: Number(m.renda) || 0 }; });
  S.config = { ...CONFIG_PADRAO, ...(d.config || {}), exemplo: false, iniciado: true };
  await Promise.all([DB.escrever('lanc', S.lanc), DB.escrever('meses', Object.values(S.meses)), salvarConfig()]);
  const ms = mesesOrdenados(); S.mes = S.meses[hojeId()] ? hojeId() : ms[ms.length - 1]; S.aba = 'inicio';
  pedirPersistencia();
  render(); toast(`Backup importado: ${S.lanc.length} lançamentos em ${ms.length} ${ms.length === 1 ? 'mês' : 'meses'}.`);
}

async function apagarTudo(manterConfig) {
  await Promise.all([DB.limpar('lanc'), DB.limpar('meses')]);
  S.lanc = []; S.meses = {};
  S.config = manterConfig ? { ...S.config, exemplo: false, iniciado: false } : { ...CONFIG_PADRAO };
  await salvarConfig();
}

/* ---------------- dados de exemplo ---------------- */
async function carregarExemplo() {
  await apagarTudo(false);
  const fim = hojeId();
  const ids = [-3, -2, -1, 0].map(d => somaMes(fim, d));
  const fixos = [['Aluguel', 1850, 'Boleto'], ['Condomínio', 420, 'Boleto'], ['Internet', 110, 'Boleto'], ['Plano de saúde', 560, 'Boleto'], ['Energia', 190, 'Pix'], ['Streaming', 45.9, 'Crédito']];
  const varis = [['Mercado', 680, 'Débito'], ['Farmácia', 96.5, 'Crédito'], ['Uber', 64, 'Crédito'], ['Restaurante', 142, 'Crédito'], ['Padaria', 38, 'Pix'], ['Presente', 120, 'Pix'], ['Combustível', 250, 'Débito']];
  ids.forEach((id, k) => {
    S.meses[id] = { id, renda: 7200 };
    fixos.forEach(f => S.lanc.push({ id: uid(), mes: id, classificacao: 'Fixo', descricao: f[0], valor: f[1], metodo: f[2], atual: null, total: null, criadoEm: Date.now() }));
    varis.forEach((v, j) => { if ((j + k) % 5 !== 4) S.lanc.push({ id: uid(), mes: id, classificacao: 'Variável', descricao: v[0], valor: Math.round(v[1] * (0.8 + ((j * 7 + k * 3) % 6) / 10) * 100) / 100, metodo: v[2], atual: null, total: null, criadoEm: Date.now() }); });
    S.lanc.push({ id: uid(), mes: id, classificacao: 'Variável', descricao: 'Geladeira nova', valor: 289.9, metodo: 'Crédito', atual: k + 2, total: 10, criadoEm: Date.now() });
  });
  S.config = { ...CONFIG_PADRAO, rendaPadrao: 7200, exemplo: true, iniciado: true };
  await Promise.all([DB.escrever('lanc', S.lanc), DB.escrever('meses', Object.values(S.meses)), salvarConfig()]);
  S.mes = fim; S.aba = 'inicio';
  render();
}

function pedirPersistencia() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignora */ }
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.classList.contains('veu') || t.closest('button[data-fechar]')) { fecharFolha(); return; }
  const aba = t.closest('.nav [data-aba]');
  if (aba) { S.aba = aba.dataset.aba; render(); window.scrollTo(0, 0); return; }
  if (t.closest('#btnMais')) { abrirFormulario(); return; }
  const ed = t.closest('[data-editar]');
  if (ed) { const l = S.lanc.find(x => x.id === ed.dataset.editar); if (l) abrirFormulario(l); return; }
  const fl = t.closest('[data-filtro]');
  if (fl) { S.filtro = fl.dataset.filtro; render(); return; }
  const hit = t.closest('.hit');
  if (hit) { mostrarDica(hit); return; }
  if (!t.closest('.dica')) document.querySelectorAll('.dica').forEach(d => d.remove());
  const rm = t.closest('[data-remover-metodo]');
  if (rm) {
    const i = +rm.dataset.removerMetodo;
    if (S.config.metodos.length <= 1) return toast('Mantenha pelo menos um método.');
    const nome = S.config.metodos[i];
    S.config.metodos.splice(i, 1); await salvarConfig(); render(); toast(`${nome} removido. Gastos antigos com ele continuam salvos.`); return;
  }
  const ac = t.closest('[data-acao]');
  if (!ac) return;
  const a = ac.dataset.acao;
  const ms = mesesOrdenados();
  if (a === 'mesAnt') { const i = ms.indexOf(S.mes); if (i > 0) { S.mes = ms[i - 1]; render(); } }
  else if (a === 'mesProx') { S.mes = somaMes(S.mes, 1); render(); }
  else if (a === 'criarProx') abrirCriarMes(somaMes(S.mes, 1));
  else if (a === 'comecar') {
    const r = paraNumero($('#rendaInicial').value);
    S.config = { ...S.config, rendaPadrao: isFinite(r) ? r : 0, iniciado: true, exemplo: false };
    await salvarConfig();
    await salvarMes({ id: hojeId(), renda: isFinite(r) ? r : 0 });
    S.mes = hojeId(); S.aba = 'inicio'; pedirPersistencia(); render(); processarCarteira();
  }
  else if (a === 'exemplo') { await carregarExemplo(); toast('Dados de exemplo carregados.'); }
  else if (a === 'sairExemplo') { await apagarTudo(false); render(); }
  else if (a === 'importar') $('#arquivo').click();
  else if (a === 'liberarNotif') window.Android.abrirPermissao();
  else if (a === 'infoApp') window.Android.abrirInfoApp();
  else if (a === 'limparRegistro') { S.notifLog = []; await salvarRegistro(); render(); }
  else if (a === 'exportar') exportar();
  else if (a === 'csv') exportarCSV();
  else if (a === 'apagarMes' || a === 'apagarTudo') {
    if (!ac.classList.contains('armado')) { ac.classList.add('armado'); ac.textContent = 'Confirmar'; setTimeout(() => { if (ac.isConnected) { ac.classList.remove('armado'); ac.textContent = a === 'apagarMes' ? 'Apagar' : 'Apagar tudo'; } }, 4000); return; }
    if (a === 'apagarTudo') { await apagarTudo(false); S.aba = 'inicio'; render(); toast('Tudo apagado.'); return; }
    const alvo = S.mes;
    const ids = S.lanc.filter(l => l.mes === alvo).map(l => l.id);
    S.lanc = S.lanc.filter(l => l.mes !== alvo); delete S.meses[alvo];
    await DB.escrever('lanc', [], ids); await DB.escrever('meses', [], [alvo]);
    const rest = mesesOrdenados();
    if (!rest.length) { S.config.iniciado = false; await salvarConfig(); }
    S.mes = rest[rest.length - 1] || null; render(); toast(`${nomeMes(alvo)} apagado.`);
  }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'rendaMes') {
    const v = paraNumero(t.value);
    await salvarMes({ ...(S.meses[S.mes] || { id: S.mes }), renda: isFinite(v) ? v : 0 });
    t.value = fmtEntrada(isFinite(v) ? v : 0); toast('Renda do mês atualizada.');
  } else if (t.id === 'rendaPadrao') {
    const v = paraNumero(t.value);
    S.config.rendaPadrao = isFinite(v) ? v : 0; await salvarConfig();
    t.value = fmtEntrada(S.config.rendaPadrao); toast('Renda padrão atualizada.');
  } else if (t.id === 'lerCarteira') {
    window.Android.definirLeitura(t.checked);
    render();
    toast(!t.checked ? 'Lançamento automático desligado.'
      : (window.Android.leituraPermitida() ? 'Lançamento automático ligado.' : 'Agora libere o acesso às notificações.'));
    if (t.checked) processarCarteira();
  } else if (t.name === 'metodoCarteira') {
    S.config.metodoCarteira = t.value; await salvarConfig();
    toast(`Compras da Samsung Wallet entram como ${t.value}.`);
  } else if (t.id === 'arquivo' && t.files && t.files[0]) {
    const txt = await t.files[0].text();
    t.value = '';
    await importarTexto(txt);
  }
});

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'formMetodo') return;
  ev.preventDefault();
  const v = $('#novoMetodo').value.trim();
  if (!v) return;
  if (S.config.metodos.some(m => m.toLowerCase() === v.toLowerCase())) return toast('Esse método já existe.');
  S.config.metodos.push(v); await salvarConfig(); render(); toast(`${v} adicionado.`);
});

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#camada').innerHTML) fecharFolha(); });

/* botão Voltar do Android: fecha a folha, depois volta para o Início, depois sai */
window.__voltar = function () {
  if ($('#camada').innerHTML) { fecharFolha(); return true; }
  if (S.aba !== 'inicio' && S.config.iniciado) { S.aba = 'inicio'; render(); window.scrollTo(0, 0); return true; }
  return false;
};

/* chamados pelo app Android: ao voltar para o app (ex.: das Configurações) e quando a carteira avisa uma compra */
window.__aoRetomar = function () {
  if (!temLeitor()) return;
  if (S.aba === 'ajustes' && S.config.iniciado && !$('#camada').innerHTML) render();   // atualiza "Falta um passo" / "Ligado"
  processarCarteira();
};
window.__novaNotificacao = () => processarCarteira();

/* ---------------- início ---------------- */
(async function iniciar() {
  await carregar();
  const ms = mesesOrdenados();
  S.mes = S.meses[hojeId()] ? hojeId() : ms[ms.length - 1] || hojeId();
  render();
  processarCarteira();   // compras da Samsung Wallet que chegaram com o app fechado
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent|androidplatform\.net/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
